name: CI/CD Security Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: webgoat/pom.xml

      - name: Build and run unit tests
        id: build
        working-directory: webgoat
        run: bash ./mvnw --batch-mode clean package

      - name: Trivy dependency gate
        id: dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: ./webgoat
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy-dependencies.json
          trivyignores: .trivyignore.yaml
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'

      - name: Build Docker image
        id: image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker compose build --pull

      - name: Trivy container gate
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: webgoat-app:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy-container.json
          trivyignores: .trivyignore.yaml
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'

      - name: Upload security and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-and-test-reports
          path: |
            trivy-*.json
            webgoat/target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Explain lab security policy
        if: always()
        run: |
          echo "## Security scope" >> "$GITHUB_STEP_SUMMARY"
          echo "HIGH/CRITICAL dependency and image findings block, except the exact XStream 1.4.5 lesson CVEs documented in docs/security-pipeline.md (expire 2026-10-29)." >> "$GITHUB_STEP_SUMMARY"
          echo "Suppressed findings remain in the JSON reports. Unit tests run; browser/integration tests are not part of this job." >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secrets gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  sast:
    name: SAST inventory (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: python3 -m pip install semgrep==1.178.0
      - name: Collect SAST findings
        run: semgrep scan --config p/java --json --output semgrep.json --metrics=off webgoat
      - name: Report advisory findings
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("semgrep.json").read_text())
          count = len(report.get("results", []))
          errors = report.get("errors", [])
          summary = f"SAST inventory: {count} findings, {len(errors)} scan errors. Advisory only; not a SAST security gate."
          print(f"::warning::{summary}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("## SAST inventory (advisory)\n" + summary + "\n")
          if errors:
              raise SystemExit("Semgrep scan errors must be investigated.")
          PY
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30
