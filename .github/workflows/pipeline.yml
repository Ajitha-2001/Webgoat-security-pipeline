name: CI/CD Security Pipeline

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make mvnw executable
        working-directory: ./webgoat
        run: chmod +x mvnw

      - name: Build with Maven
        working-directory: ./webgoat
        run: ./mvnw clean package -DskipTests

      # --- Gate 1: Secrets scanning (report only, don't block the job) ---
      - name: Gitleaks secrets scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Gate 3: SAST (report only) ---
      - name: Semgrep SAST scan
        continue-on-error: true
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java

      - name: Build Docker image
        continue-on-error: true
        run: docker compose build

      # --- Gate 4: Container image scanning (report only) ---
      - name: Trivy container scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'webgoat-app:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # --- Gate 2: Dependency / SCA scanning — THIS is your designated blocking gate ---
      - name: OWASP Dependency-Check
        working-directory: ./webgoat
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7