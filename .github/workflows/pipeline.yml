name: CI/CD Security Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Required so Gitleaks can inspect pull requests
permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Set up Java
      # ---------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # ---------------------------------------------------------
      # 3. Make Maven wrapper executable
      # ---------------------------------------------------------
      - name: Make mvnw executable
        working-directory: ./webgoat
        run: chmod +x mvnw

      # ---------------------------------------------------------
      # 4. Build and test application
      # Assignment requirement: build + tests on every push
      # ---------------------------------------------------------
      - name: Build and test with Maven
        working-directory: ./webgoat
        run: ./mvnw clean verify

      # ---------------------------------------------------------
      # 5. Secrets scanning - BLOCKING SECURITY GATE
      #
      # No continue-on-error here.
      # If Gitleaks finds a secret, this step fails the pipeline.
      # ---------------------------------------------------------
      - name: Gitleaks secrets scan - Security Gate
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 6. Dependency / filesystem vulnerability scanning
      #
      # WebGoat is intentionally vulnerable, so this scan remains
      # advisory instead of permanently failing the pipeline.
      # ---------------------------------------------------------
      - name: Trivy dependency scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './webgoat'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # ---------------------------------------------------------
      # 7. SAST - Static Application Security Testing
      # ---------------------------------------------------------
      - name: Semgrep SAST scan
        continue-on-error: true
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java

      # ---------------------------------------------------------
      # 8. Build Docker image
      # ---------------------------------------------------------
      - name: Build Docker image
        run: docker compose build

      # ---------------------------------------------------------
      # 9. Container image vulnerability scanning
      #
      # Advisory because the base WebGoat application may contain
      # known vulnerable components.
      # ---------------------------------------------------------
      - name: Trivy container scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'webgoat-app:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
