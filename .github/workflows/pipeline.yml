name: CI/CD Security Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Allow GitHub Actions and Gitleaks to read repository/PR information
permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Set up Java 25
      # ---------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # ---------------------------------------------------------
      # 3. Make Maven wrapper executable
      # ---------------------------------------------------------
      - name: Make mvnw executable
        working-directory: ./webgoat
        run: chmod +x mvnw

      # ---------------------------------------------------------
      # 4. Run Maven tests
      # ---------------------------------------------------------
      - name: Run Maven tests
        working-directory: ./webgoat
        run: ./mvnw clean test

      # ---------------------------------------------------------
      # 5. Package application
      # Creates the JAR required by the Dockerfile
      # Tests already ran above, so they are skipped here
      # ---------------------------------------------------------
      - name: Package application
        working-directory: ./webgoat
        run: ./mvnw package -DskipTests

      # ---------------------------------------------------------
      # 6. Gitleaks secrets scan
      # BLOCKING SECURITY GATE
      # No continue-on-error here.
      # ---------------------------------------------------------
      - name: Gitleaks secrets scan - Security Gate
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 7. Dependency / filesystem vulnerability scan
      # Advisory because WebGoat is intentionally vulnerable
      # ---------------------------------------------------------
      - name: Trivy dependency scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './webgoat'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # ---------------------------------------------------------
      # 8. Static Application Security Testing (SAST)
      # ---------------------------------------------------------
      - name: Semgrep SAST scan
        continue-on-error: true
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java

      # ---------------------------------------------------------
      # 9. Build Docker image
      # ---------------------------------------------------------
      - name: Build Docker image
        run: docker compose build

      # ---------------------------------------------------------
      # 10. Container vulnerability scan
      # Advisory because WebGoat intentionally contains
      # vulnerable components
      # ---------------------------------------------------------
      - name: Trivy container scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'webgoat-app:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
