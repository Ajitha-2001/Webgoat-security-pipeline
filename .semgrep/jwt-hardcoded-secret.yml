rules:
  - id: jwt-hardcoded-weak-secret
    languages: [java]
    severity: ERROR
    message: JWT signing secret comes from hardcoded literals (or a hardcoded list) instead of an environment variable or secret store.
    pattern-either:
      - pattern: TextCodec.BASE64.encode("...")
      - pattern: TextCodec.BASE64.encode($ARR[new Random().nextInt(...)])
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 Cryptographic Failures"