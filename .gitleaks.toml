title = "Gitleaks config for WebGoat security pipeline"

[extend]
useDefault = true

[allowlist]
description = "WebGoat's own lesson/test fixtures - dummy keys used for teaching, not real secrets"
paths = [
  '''webgoat/src/main/java/org/owasp/webgoat/lessons/.*''',
  '''webgoat/src/main/resources/lessons/jwt/.*''',
  '''webgoat/src/test/java/org/owasp/webgoat/lessons/jwt/.*''',
  '''webgoat/src/test/java/org/owasp/webgoat/webwolf/jwt/.*''',
]